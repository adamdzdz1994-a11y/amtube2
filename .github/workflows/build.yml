name: Build AMTube APK

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # YouTube needs a small JavaScript engine next to yt-dlp. We build QuickJS for 64-bit Android here.
      # If this step fails the app still builds and works for every other site.
      - name: Build QuickJS (helper for YouTube)
        continue-on-error: true
        run: |
          set -e
          git clone --depth 1 --branch v0.17.0 https://github.com/quickjs-ng/quickjs.git /tmp/qjs || git clone --depth 1 https://github.com/quickjs-ng/quickjs.git /tmp/qjs
          cmake -S /tmp/qjs -B /tmp/qjs/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/qjs/build -j4 || cmake --build /tmp/qjs/build --target qjs_exe -j4 || cmake --build /tmp/qjs/build --target qjs -j4
          BIN=$(find /tmp/qjs/build -type f -name qjs -perm -u+x | head -1)
          test -n "$BIN"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$BIN" app/src/main/jniLibs/arm64-v8a/libqjs.so
          ls -l app/src/main/jniLibs/arm64-v8a

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AMTube-APK
          path: app/build/outputs/apk/debug/*.apk
